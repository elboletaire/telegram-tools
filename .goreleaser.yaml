version: 2

project_name: ttools

builds:
  - id: ttools
    main: ./cmd/ttools
    binary: ttools
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  # Only the commit message, without the conventional commit prefix, SHA or author.
  format: '{{ $parts := split .Message ": " }}{{ if eq (len $parts) 2 }}{{ index $parts 1 }}{{ else }}{{ .Message }}{{ end }}'
  filters:
    exclude:
      - '^(build|chore|ci|docs|refactor|style|test)(\(.*\))?!?:'
  groups:
    - title: Features
      regexp: '^feat(\(.*\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.*\))?!?:'
      order: 1
    - title: Other changes
      order: 999

git:
  # Stable releases compare against the previous stable one, not its release
  # candidates, so their changelog covers everything since the last release.
  ignore_tags:
    - "{{ if not .Prerelease }}*-rc*{{ end }}"

release:
  # Tags like v1.0.0-rc.1 are published as GitHub pre-releases.
  prerelease: auto
